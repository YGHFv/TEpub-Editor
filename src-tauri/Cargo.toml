[package]
name = "tepub-editor"
version = "1.2.1"
description = "TEpub Editor - a TXT/EPUB workbench for library management, editing, reading and toolbox utilities"
authors = ["YGHFv"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tepub_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "TEpub-Editor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json", "multipart"] }
# --- 新增的依赖 ---
chardetng = "0.1"
fancy-regex = "0.13"
chrono = "0.4"
md5 = "0.7"
uuid = { version = "1.4", features = ["v4", "fast-rng", "macro-diagnostics"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
once_cell = "1.19"
base64 = "0.22"

# --- 核心算法库 ---
quick-xml = { version = "0.36", features = ["serialize"] }
encoding_rs = "0.8"
tempfile = "3.24.0"
walkdir = "2.5.0"
image = "0.25"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# 开发构建默认完全不优化。解压 EPUB、Zip 扫描、正则与文本处理全是 CPU 密集的，
# debug 下比 release 慢一个数量级，同一本书 dev 里打开要几秒、编译版却很快 ——
# 用户看到的就是"dev 特别卡"。开 1 级优化（依赖用 3 级）后 dev 运行速度接近
# release，只多花一点编译时间；调试符号仍保留，断点照常可用。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
